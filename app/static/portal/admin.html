<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Admin</title><style>body{font-family:Inter,system-ui;background:#f5f7fb;margin:0}.top{background:#111;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.card{background:#fff;border-radius:16px;padding:22px}.n{font-size:32px;font-weight:800}</style></head><body><div class=top>FoodDash Command Center</div><div class=wrap><div id=grid class=grid></div><pre id=out></pre></div><script>const token=localStorage.token;if(!token)location.href='/login';async function load(){let r=await fetch('/api/admin/dashboard',{headers:{Authorization:'Bearer '+token}});let j=await r.json();if(!r.ok){out.textContent=j.detail;return}grid.innerHTML=Object.entries(j).map(([k,v])=>`<div class=card><small>${k}</small><div class=n>${typeof v==='number'&&k==='revenue'?'R'+v.toFixed(2):v}</div></div>`).join('')}load();setInterval(load,10000)</script></body></html>
