<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Driver App</title><style>body{font-family:Inter,system-ui;background:#eef2f7;margin:0}.top{background:#111;color:#fff;padding:20px}.wrap{max-width:800px;margin:auto;padding:20px}.card{background:#fff;padding:20px;margin:12px 0;border-radius:16px}button{padding:12px 15px;border:0;border-radius:10px;background:#111;color:#fff}</style></head><body><div class=top>FoodDash Driver</div><div class=wrap><div class=card><h2>GPS</h2><button onclick=startGPS>Go online & share location</button><p id=gps>Offline</p></div><div id=orders></div></div><script>const token=localStorage.token;if(!token)location.href='/login';let watch;function startGPS(){if(!navigator.geolocation)return gps.textContent='GPS unavailable';watch=navigator.geolocation.watchPosition(async p=>{let r=await fetch('/api/driver/location',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})});gps.textContent=r.ok?'Online • '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5):'GPS update failed'},{enableHighAccuracy:true,maximumAge:5000});}async function load(){let r=await fetch('/api/driver/orders',{headers:{Authorization:'Bearer '+token}});let j=await r.json();orders.innerHTML=j.map(o=>`<div class=card><h3>Order #${o.id}</h3><p>${o.status} • R${o.total.toFixed(2)}</p><button onclick="accept(${o.id})">Accept</button></div>`).join('')}async function accept(id){await fetch('/api/driver/orders/'+id+'/accept',{method:'POST',headers:{Authorization:'Bearer '+token}});load()}load();setInterval(load,5000)</script></body></html>
