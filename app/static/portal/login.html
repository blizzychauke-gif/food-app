<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><title>FoodDash Login</title><style>body{font-family:Inter,system-ui;background:#f5f7fb;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:32px;border-radius:18px;width:min(420px,90%);box-shadow:0 15px 50px #0001}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}button{background:#111;color:#fff;cursor:pointer}</style></head><body><div class=card><h1>FoodDash</h1><p>Secure account access</p><input id=email type=email placeholder="Email"><input id=pw type=password placeholder="Password"><button onclick=login()>Sign in</button><p id=msg></p><hr><h3>Create account</h3><input id=name placeholder="Full name"><button onclick=register()>Register</button></div><script>async function post(path,body){let r=await fetch('/api/auth'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}function done(j){localStorage.token=j.access_token;location.href='/'}async function login(){try{done(await post('/login',{email:email.value,password:pw.value}))}catch(e){msg.textContent=e.message}}async function register(){try{done(await post('/register',{email:email.value,password:pw.value,full_name:name.value}))}catch(e){msg.textContent=e.message}}</script></body></html>
