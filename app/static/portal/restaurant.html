<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Restaurant Console</title><style>body{font-family:Inter,system-ui;margin:0;background:#f5f7fb}.top{padding:20px;background:#111;color:white}.wrap{max-width:1100px;margin:25px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;padding:18px;border-radius:16px;box-shadow:0 8px 30px #0001}button{padding:9px 12px;border:0;border-radius:8px;background:#111;color:white}</style></head><body><div class=top><b>FoodDash Restaurant Operations</b></div><div class=wrap><div id=cards class=grid></div></div><script>const token=localStorage.token;if(!token)location.href='/login';async function load(){let r=await fetch('/api/restaurant/orders',{headers:{Authorization:'Bearer '+token}});let j=await r.json();cards.innerHTML=j.map(o=>`<div class=card><h3>Order #${o.id}</h3><p>Status: <b>${o.status}</b></p><p>R${o.total.toFixed(2)}</p><button onclick="setStatus(${o.id},'PREPARING')">Start preparing</button> <button onclick="setStatus(${o.id},'READY')">Ready</button></div>`).join('')}async function setStatus(id,s){await fetch('/api/restaurant/orders/'+id+'/status?new_status='+s,{method:'PATCH',headers:{Authorization:'Bearer '+token}});load()}load();setInterval(load,5000)</script></body></html>
